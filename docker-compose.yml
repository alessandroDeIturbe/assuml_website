services:
  db:
    image: postgres:16-alpine
    container_name: assuml_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     assuml
      POSTGRES_PASSWORD: assuml_pass
      POSTGRES_DB:       assuml_db
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  storage:
    image: minio/minio:latest
    container_name: assuml_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     assuml_admin
      MINIO_ROOT_PASSWORD: supersecret
    volumes:
      - ./minio_data:/data    # dati ispezionabili in assuml_website/minio_data/
    ports:
      - '9000:9000'
      - '9001:9001'

  # Init: crea bucket + CORS per PUT presigned da browser su localhost:3000
  createbucket:
    image: minio/mc:latest
    depends_on: [storage]
    volumes:
      - ./minio-cors.json:/tmp/cors.json:ro
    entrypoint: >
      /bin/sh -c "
        sleep 6;
        mc alias set myminio http://storage:9000 assuml_admin supersecret;
        mc mb --ignore-existing myminio/assuml-notes;
        mc anonymous set none myminio/assuml-notes;
        mc admin config set myminio/ api cors_allow_origin='http://localhost:3000' || true;
        exit 0;
      "

volumes:
  pg_data:
